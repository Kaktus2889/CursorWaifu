name: Build Windows EXE

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "app.py"
      - "requirements.txt"
      - "assets/**"
      - ".github/workflows/build-windows.yml"

jobs:
  build:
    runs-on: windows-latest
    permissions:
      contents: read

    steps:
      - name: Pobierz kod
        uses: actions/checkout@v4

      - name: Ustaw Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Zainstaluj zależności
        run: python -m pip install -r requirements.txt

      - name: Zbuduj CursorWaifu.exe
        run: >-
          python -m PyInstaller
          --noconfirm
          --clean
          --onefile
          --windowed
          --name CursorWaifu
          --add-data "assets/waifu_sprites.webp;assets"
          app.py

      - name: Udostępnij gotowy program
        uses: actions/upload-artifact@v4
        with:
          name: CursorWaifu-Windows
          path: dist/CursorWaifu.exe
          if-no-files-found: error
