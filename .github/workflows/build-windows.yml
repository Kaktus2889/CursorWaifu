name: Build Windows EXE

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "app.py"
      - "motion.py"
      - "caret.py"
      - "animation.py"
      - "update_checker.py"
      - "version.py"
      - "test_*.py"
      - "requirements.txt"
      - "assets/**"
      - ".github/workflows/build-windows.yml"

jobs:
  build:
    runs-on: windows-latest
    permissions:
      contents: write

    steps:
      - name: Pobierz kod
        uses: actions/checkout@v4

      - name: Ustaw Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Zainstaluj zależności
        run: python -m pip install -r requirements.txt

      - name: Ustaw numer buildu
        shell: pwsh
        run: Set-Content -Path version.py -Value "BUILD_NUMBER = $env:GITHUB_RUN_NUMBER"

      - name: Testy ruchu i animacji
        # Regression tests run before packaging and publishing.
        # GUI is tested offscreen; desktop interaction still needs a real desktop.
        run: python -m unittest discover -v

      - name: Pakuj CursorWaifu.exe
        run: >-
          python -m PyInstaller
          --noconfirm
          --clean
          --onefile
          --windowed
          --name CursorWaifu
          --add-data "assets/idle_v3.webp;assets"
          --add-data "assets/motion_v2.webp;assets"
          app.py

      - name: Udostępnij gotowy program
        uses: actions/upload-artifact@v4
        with:
          name: CursorWaifu-Windows
          path: dist/CursorWaifu.exe
          if-no-files-found: error

      - name: Opublikuj EXE w Releases
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          RELEASE_COMMIT: ${{ github.sha }}
          RELEASE_NUMBER: ${{ github.run_number }}
          RELEASE_ATTEMPT: ${{ github.run_attempt }}
        run: |
          $tag = "windows-$env:RELEASE_NUMBER-$env:RELEASE_ATTEMPT"
          gh release create $tag "dist/CursorWaifu.exe" --target "$env:RELEASE_COMMIT" --title "CursorWaifu Windows $env:RELEASE_NUMBER" --notes "Przenosna wersja Windows. Pobierz CursorWaifu.exe i uruchom. Python nie jest wymagany." --draft
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          gh release edit $tag --draft=false --latest
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

